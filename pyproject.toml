[tool.autopep8]
max-line-length = 131

[tool.isort]
line_length = 131

[tool.ruff]
line-length = 131

[tool.ruff.lint]
select = [
	# Standard errors and warnings
	"E",
	"W",
	"F",
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
